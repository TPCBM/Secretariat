    .tab-content {

    }

    @keyframes fadeIn {

    .form-group {

    label {

    .autocomplete-container {

    }

      display: none;

    .autocomplete-item {

    }
    
    .autocomplete-item:hover {

    }
    
    .btn {

    .btn-primary {

    .btn-danger {

    }
    
    .btn-danger:hover {

    }

    .booking-item.approved {

    .booking-item.rejected {

/* ⭐ 新增：Modal 彈窗樣式 */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.6);
  z-index: 9999;
  justify-content: center;
  align-items: center;
}

.modal-overlay.show {
  display: flex;
}

.modal-content {
  background-color: white;
  padding: 40px 30px;
  border-radius: 15px;
  text-align: center;
  min-width: 320px;
  max-width: 500px;
  width: 90%;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  animation: modalSlideIn 0.3s ease;
}

@keyframes modalSlideIn {
  from {
    opacity: 0;
    transform: scale(0.9) translateY(-20px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.modal-icon {
  font-size: 60px;
  margin-bottom: 20px;
  animation: iconPop 0.5s ease;
}

@keyframes iconPop {
  0% { transform: scale(0); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

.modal-icon.success {
  color: #27ae60;
}

.modal-icon.error {
  color: #e74c3c;
}

.modal-icon.loading {
  color: #667eea;
}

.modal-title {
  font-size: 1.5rem;
  font-weight: 700;
  margin-bottom: 15px;
  color: #333;
}

.modal-message {
  font-size: 1.1rem;
  margin-bottom: 30px;
  color: #666;
  line-height: 1.6;
}

.modal-button {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  padding: 14px 50px;
  font-size: 1.1rem;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s;
  min-width: 150px;
}

.modal-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

.modal-button:active {
  transform: translateY(0);
}

.loading-spinner {
  border: 4px solid #f3f3f3;
  border-top: 4px solid #667eea;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 1s linear infinite;
  margin: 0 auto 20px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

      <div class="custom-alert-title">無法送出申請</div>
      <div class="custom-alert-message" id="customAlertMessage"></div>
      <button class="custom-alert-button" onclick="closeCustomAlert()">確定</button>
    </div>
  </div>

<script>
  let userHistory = [];
  
  // ⚠️ 注意：這裡的網址目前是你原本的舊部署網址
  // 在你修改完 GAS 的 doPost 並重新部署「新版本」後，請記得將這個網址換成新的！
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycby8hKhueE5v0nW3Lcf2IT4fJRkuJ_c8VI4xPcdZiWU9XATklQw8TRa2S4H63qD79LWTsw/exec'; 

  // ⭐ 新增：共用的 API 呼叫函數 (取代 google.script.run)
  async function callGasApi(action, params = {}) {
    try {
      const response = await fetch(GAS_API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8", // 避開 CORS 限制
        },
        body: JSON.stringify({
          action: action,
          ...params
        })
      });
      // 自動將回傳的 JSON 轉回物件
      return await response.json(); 
    } catch (error) {
      console.error("API 請求失敗:", error);
      throw error;
    }
  }

  // 自訂彈窗函數
  function showCustomAlert(message) {
    document.getElementById('customAlertMessage').textContent = message;
    document.getElementById('customAlertOverlay').style.display = 'block';
  }
  
  function closeCustomAlert() {
    document.getElementById('customAlertOverlay').style.display = 'none';
  }
  
  // ⭐ 返回日曆函數 (改為導向 GitHub 的實體 HTML 檔案)
  function goBackToCalendar() {
    window.location.href = 'calandar.html'; 
  }

  // ⭐ 頁面載入處理
  window.addEventListener('load', function() {
    console.log('Page loaded');
    
    // ⭐ 從網址抓取 date 參數 (取代 GAS 的預設填入)
    // 適用於從日曆點擊跳轉過來時的網址，例如：apply.html?date=2026-03-25
    const urlParams = new URLSearchParams(window.location.search);
    const dateParam = urlParams.get('date');
    const parkingDateInput = document.getElementById('parkingDate');
    
    if (dateParam && parkingDateInput) {
      parkingDateInput.value = dateParam;
      console.log('Preselected date from URL:', dateParam);
    }
    
    // ⭐ 載入使用者歷史記錄 (改用 callGasApi)
    callGasApi('getUserHistory')
      .then(result => {
        // 為了保險，相容 GAS 轉字串的情境
        const res = typeof result === 'string' ? JSON.parse(result) : result;
        if (res.success) {
          userHistory = res.history;
        }
      })
      .catch(error => console.error('取得歷史紀錄失敗:', error));
    
    // 初始化 Modal
    initializeModal();
  });

  // Modal 彈窗功能（完全修正版）
  function initializeModal() {
    const modal = document.getElementById('resultModal');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const modalButton = document.getElementById('modalButton');
    const modalSpinner = document.getElementById('modalSpinner');
    
    if (!modal || !modalButton) {
      console.error('Modal elements not found!');
      return;
    }
    
    // ⭐ 點擊確定後返回日曆 (改為實體檔案跳轉)
    modalButton.addEventListener('click', function() {
      console.log('Modal button clicked');
      modal.classList.remove('show');
      window.location.href = 'calandar.html'; // 跳回首頁
    });
    
    // 防止點擊 Modal 外部關閉
    modal.addEventListener('click', function(e) {
      if (e.target === modal) {
        const content = modal.querySelector('.modal-content');
        content.style.animation = 'none';
        setTimeout(() => {
          content.style.animation = 'shake 0.5s';
        }, 10);
      }
    });
    
    // 添加震動動畫
    if (!document.getElementById('shakeAnimation')) {
      const style = document.createElement('style');
      style.id = 'shakeAnimation';
      style.textContent = `
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
          20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
      `;
      document.head.appendChild(style);
    }
    
    // 將 Modal 函數掛載到 window
    window.showModalLoading = function(message) {
      modal.classList.add('show');
      modalIcon.className = 'modal-icon loading';
      modalIcon.innerHTML = '⏳';
      modalTitle.textContent = '處理中';
      modalMessage.textContent = message || '處理中，請稍候...';
      modalButton.style.display = 'none';
      modalSpinner.style.display = 'block';
    };
    
    window.showModalSuccess = function(message) {
      modalIcon.className = 'modal-icon success';
      modalIcon.innerHTML = '✓';
      modalTitle.textContent = '申請成功！';
      modalMessage.textContent = message;
      modalSpinner.style.display = 'none';
      modalButton.style.display = 'inline-block';
      modalButton.textContent = '確定';
    };
    
    window.showModalError = function(message) {
      modalIcon.className = 'modal-icon error';
      modalIcon.innerHTML = '✕';
      modalTitle.textContent = '申請失敗';
      modalMessage.textContent = message;
      modalSpinner.style.display = 'none';
      modalButton.style.display = 'inline-block';
      modalButton.textContent = '確定';
    };
  }
  
  // 分頁切換
  function switchTab(tabName) {
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById(tabName).classList.add('active');
  }
  
  // Autocomplete 功能
  const nameInput = document.getElementById('name');
  const autocompleteList = document.getElementById('nameAutocomplete');
  
  if (nameInput && autocompleteList) {
    nameInput.addEventListener('input', function() {
      const value = this.value.toLowerCase();
      autocompleteList.innerHTML = '';
      
      if (value.length < 1) {
        autocompleteList.style.display = 'none';
        return;
      }
      
      const matches = userHistory.filter(item => 
        item.name.toLowerCase().includes(value)
      );
      
      if (matches.length > 0) {
        matches.forEach(item => {
          const div = document.createElement('div');
          div.className = 'autocomplete-item';
          div.textContent = `${item.name} (${item.employeeId})`;
          div.onclick = function() {
            document.getElementById('name').value = item.name;
            document.getElementById('employeeId').value = item.employeeId;
            document.getElementById('extension').value = item.extension;
            document.getElementById('licensePlate').value = item.licensePlate;
            autocompleteList.style.display = 'none';
          };
          autocompleteList.appendChild(div);
        });
        autocompleteList.style.display = 'block';
      } else {
        autocompleteList.style.display = 'none';
      }
    });
  }
  
  // 點擊外部關閉 autocomplete
  document.addEventListener('click', function(e) {
    if (autocompleteList && !e.target.closest('.autocomplete-container')) {
      autocompleteList.style.display = 'none';
    }
  });
  
  // ⭐ 送出申請 (改用 callGasApi)
  const bookingForm = document.getElementById('bookingForm');
  if (bookingForm) {
    bookingForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const data = {
        department: document.getElementById('department').value,
        name: document.getElementById('name').value,
        employeeId: document.getElementById('employeeId').value,
        extension: document.getElementById('extension').value,
        licensePlate: document.getElementById('licensePlate').value.toUpperCase(),
        parkingDate: document.getElementById('parkingDate').value,
        entryTime: document.getElementById('entryTime').value
      };
      
      window.showModalLoading('正在處理您的申請...');
      
      callGasApi('createBooking', { data: data })
        .then(result => {
          // 防護措施：確保拿到的是物件
          const res = typeof result === 'string' ? JSON.parse(result) : result;
          
          if (res.success) {
            window.showModalSuccess(res.message || '預約申請已送出，等待管理者審核');
          } else {
            if (res.message && (res.message.includes('已達申請上限') || res.message.includes('請聯絡管理部門'))) {
              document.getElementById('resultModal').classList.remove('show');
              showCustomAlert(res.message);
            } else {
              window.showModalError(res.message || '申請失敗，請稍後再試');
            }
          }
        })
        .catch(error => {
          window.showModalError('系統錯誤：' + error.message);
        });
    });
  }
  
  // ⭐ 查詢單筆預約 (改用 callGasApi)
  function searchMyBooking() {
    const bookingId = document.getElementById('searchBookingId').value.trim();

    if (!bookingId) {
      showMessage('myBookingsMessage', '請輸入預約編號', 'error');
      return;
    }

    showMessage('myBookingsMessage', '查詢中...', 'info');

    callGasApi('getBookingById', { bookingId: bookingId })
      .then(result => {
        console.log('getBookingById result:', result);
        try {
          const res = typeof result === 'string' ? JSON.parse(result) : result;
          
          if (res.success && res.booking) {
            displayBookings([res.booking]);
            document.getElementById('myBookingsMessage').innerHTML = '';
          } else {
            showMessage('myBookingsMessage', res.message || '找不到此預約編號', 'error');
            document.getElementById('bookingsList').innerHTML = '';
          }
        } catch (parseError) {
          console.error('Parse error:', parseError);
          showMessage('myBookingsMessage', 'JSON 解析錯誤', 'error');
        }
      })
      .catch(error => {
        console.error('getBookingById error:', error);
        showMessage('myBookingsMessage', '查詢失敗：' + error.message, 'error');
      });
  }
  
  // 顯示預約列表
  function displayBookings(bookings) {
    const list = document.getElementById('bookingsList');
    if (!list) return;
    list.innerHTML = '';
    
    bookings.forEach(booking => {
      const div = document.createElement('div');
      div.className = `booking-item ${booking.status.toLowerCase()}`;
      
      const statusText = {
        'Pending': '待審核',
        'Approved': '已核准',
        'Rejected': '已駁回'
      }[booking.status] || booking.status;
      
      const statusClass = {
        'Pending': 'status-pending',
        'Approved': 'status-approved',
        'Rejected': 'status-rejected'
      }[booking.status] || '';
      
      div.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
          <div>
            <strong>${booking.name}</strong> | ${booking.department}
            <br>
            <small>預約編號：${booking.bookingId}</small>
          </div>
          <span class="status-badge ${statusClass}">${statusText}</span>
        </div>
        <div style="color: #666; font-size: 0.9rem;">
          📅 日期：${booking.parkingDate}<br>
          ⏰ 時間：${booking.entryTime}<br>
          🚙 車牌：${booking.licensePlate}
        </div>
        ${booking.status === 'Pending' || booking.status === 'Approved' ? 
          `<button onclick="cancelBooking('${booking.bookingId}', '${booking.employeeId}')" 
                  class="btn btn-danger" style="margin-top: 10px; width: 100%;">
            ❌ 取消預約
          </button>` : ''}
      `;
      
      list.appendChild(div);
    });
  }
  
  // 取消預約
  function cancelBooking(bookingId, employeeId) {
    showCancelConfirm(bookingId);
  }

  // 顯示取消確認彈窗
  function showCancelConfirm(bookingId) {
    const overlay = document.createElement('div');
    overlay.className = 'custom-alert-overlay';
    overlay.style.display = 'block';
    
    overlay.innerHTML = `
      <div class="custom-alert-box" onclick="event.stopPropagation()">
        <div class="custom-alert-icon">❓</div>
        <div class="custom-alert-title">確認取消預約</div>
        <div class="custom-alert-message">確定要取消此預約嗎？</div>
        <div style="display: flex; gap: 10px;">
          <button class="custom-alert-button" style="background: #6c757d; width: 48%;" onclick="this.closest('.custom-alert-overlay').remove()">取消</button>
          <button class="custom-alert-button" style="width: 48%;" onclick="confirmCancelBooking('${bookingId}')">確定</button>
        </div>
      </div>
    `;
    
    document.body.appendChild(overlay);
  }

  // ⭐ 確認取消預約 (改用 callGasApi)
  function confirmCancelBooking(bookingId) {
    document.querySelector('.custom-alert-overlay').remove();
    
    showMessage('myBookingsMessage', '正在取消預約...', 'info');
    
    callGasApi('cancelBookingById', { bookingId: bookingId })
      .then(result => {
        console.log('cancelBooking result:', result);
        try {
          const res = typeof result === 'string' ? JSON.parse(result) : result;
          if (res.success) {
            showMessage('myBookingsMessage', res.message, 'success');
            setTimeout(() => { searchMyBooking(); }, 1500);
          } else {
            showMessage('myBookingsMessage', res.message, 'error');
          }
        } catch (parseError) {
          console.error('Parse error:', parseError);
          showMessage('myBookingsMessage', '操作失敗', 'error');
        }
      })
      .catch(error => {
        console.error('cancelBooking error:', error);
        showMessage('myBookingsMessage', '取消失敗：' + error.message, 'error');
      });
  }
  
  // 顯示訊息
  function showMessage(elementId, message, type) {
    const element = document.getElementById(elementId);
    if (!element) return;
    element.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    
    if (type === 'success' || type === 'error') {
      setTimeout(() => { element.innerHTML = ''; }, 5000);
    }
  }
  
  // 設定最小日期為今天
  const today = new Date();
  const parkingDateEl = document.getElementById('parkingDate');
  if (parkingDateEl) {
    parkingDateEl.min = today.toISOString().split('T')[0];
  }
</script>
</body>
</html>
